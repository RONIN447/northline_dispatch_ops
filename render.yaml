services:
  - type: web
    name: northline-backend
    runtime: python
    rootDir: backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DJANGO_SETTINGS_MODULE
        value: settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,northline-backend-wvdw.onrender.com"
      - key: FRONTEND_URL
        value: "https://northline-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://northline-frontend.onrender.com"
      - key: WEATHERAPI_KEY
        sync: false

  - type: static
    name: northline-frontend
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://northline-backend-wvdw.onrender.com"
